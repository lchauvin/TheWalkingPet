services:
  db:
    image: pgvector/pgvector:pg16
    container_name: twp_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-thewalkingpet}
    ports:
      - "9876:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twp} -d ${POSTGRES_DB:-thewalkingpet}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: twp_app
    env_file: .env
    environment:
      # Inside the Compose network the DB is reachable at service "db":5432,
      # not at the host mapping (localhost:9876). These override the .env values
      # (which are correct for host-side tools like Alembic).
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${PORT:-8010}:${PORT:-8010}"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port ${PORT:-8010} --reload

volumes:
  pgdata:
