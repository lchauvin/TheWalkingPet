# Local development stack.
# Production lives in docker-compose.prod.yml — this file mounts source over the
# image and reloads on change, neither of which belongs on a deployed host.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: twp_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-thewalkingpet}
    ports:
      - "127.0.0.1:9876:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twp} -d ${POSTGRES_DB:-thewalkingpet}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runtime
    container_name: twp_app
    env_file: .env
    environment:
      # Inside the Compose network the DB is reachable at service "db":5432,
      # not at the host mapping (localhost:9876). These override the .env values
      # (which are correct for host-side tools like Alembic).
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ENVIRONMENT: local
      STORAGE_PATH: /app/storage/images
      # The weight is baked into the image; the .env value is a bare filename
      # that only resolves for host-side runs from the repo root.
      YOLO_MODEL: /opt/ml-cache/yolov8m-seg.pt
      RUN_SCHEDULER: "true"
      # Mounted below; the .env value is a host-relative path that does not
      # resolve inside the container. Same location as the prod secret.
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase_credentials
    ports:
      - "${PORT:-8010}:8010"
    volumes:
      - ./src:/app/src
      - ./storage:/app/storage
      # Push notifications are skipped with a log line when this is absent.
      - ${FIREBASE_CREDENTIALS_FILE:-./firebase-credentials.json}:/run/secrets/firebase_credentials:ro
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8010 --reload

volumes:
  pgdata:
